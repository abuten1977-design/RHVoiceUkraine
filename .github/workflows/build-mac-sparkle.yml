name: Build RHVoice Mac (Sparkle)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Sparkle short version, for example 1.0 or 1.0.140"
        required: false
        default: "1.0"
      build_number:
        description: "Sparkle build number. Defaults to the GitHub run number when empty."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-rhvoice-mac-sparkle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac-sparkle:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      SPARKLE_VERSION: "2.9.2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install build tools
        run: brew install xcodegen

      - name: Resolve Sparkle version metadata
        run: |
          set -euxo pipefail
          VERSION_NAME="${{ inputs.version_name }}"
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          fi
          RELEASE_TAG="mac-sparkle-${VERSION_NAME}-${BUILD_NUMBER}"
          ASSET_NAME="UkrainianVoicesMac-${VERSION_NAME}-${BUILD_NUMBER}.app.zip"
          {
            echo "SPARKLE_SHORT_VERSION=$VERSION_NAME"
            echo "SPARKLE_BUILD_NUMBER=$BUILD_NUMBER"
            echo "SPARKLE_RELEASE_TAG=$RELEASE_TAG"
            echo "SPARKLE_ASSET_NAME=$ASSET_NAME"
          } >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euxo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
          MACOS_CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/rhvoice-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$MACOS_CODESIGN_P12_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CODESIGN_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[ "]//g')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "MACOS_CODE_SIGN_IDENTITY=$MACOS_CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Install provisioning profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
          EXT_PROFILE_BASE64: ${{ secrets.MACOS_EXT_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/uv_mac_app.mobileprovision"
          echo "$EXT_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/uv_mac_ext.mobileprovision"

          if /usr/bin/security cms -D -i "$RUNNER_TEMP/uv_mac_app.mobileprovision" > "$RUNNER_TEMP/uv_mac_app.plist" 2>/dev/null &&
             /usr/bin/security cms -D -i "$RUNNER_TEMP/uv_mac_ext.mobileprovision" > "$RUNNER_TEMP/uv_mac_ext.plist" 2>/dev/null; then
            APP_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/uv_mac_app.plist")
            EXT_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/uv_mac_ext.plist")
            APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/uv_mac_app.plist" 2>/dev/null || true)
            EXT_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/uv_mac_ext.plist" 2>/dev/null || true)

            if [[ "$APP_ID" != "${TEAM_ID}.com.rhvoice.UkrainianVoices.mac" ||
                  "$EXT_ID" != "${TEAM_ID}.com.rhvoice.UkrainianVoices.mac.Extension" ]]; then
              echo "Provisioning profile secrets do not match current macOS bundle IDs/team; continuing without explicit profile UUIDs."
              echo "UV_MAC_APP_PROFILE_UUID=" >> "$GITHUB_ENV"
              echo "UV_MAC_EXT_PROFILE_UUID=" >> "$GITHUB_ENV"
              exit 0
            fi

            cp "$RUNNER_TEMP/uv_mac_app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$APP_UUID.mobileprovision"
            cp "$RUNNER_TEMP/uv_mac_ext.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$EXT_UUID.mobileprovision"

            echo "UV_MAC_APP_PROFILE_UUID=$APP_UUID" >> "$GITHUB_ENV"
            echo "UV_MAC_EXT_PROFILE_UUID=$EXT_UUID" >> "$GITHUB_ENV"
          else
            echo "Provisioning profile secrets are not parseable; continuing without explicit profile UUIDs."
            echo "UV_MAC_APP_PROFILE_UUID=" >> "$GITHUB_ENV"
            echo "UV_MAC_EXT_PROFILE_UUID=" >> "$GITHUB_ENV"
          fi

      - name: Create Boost unified include
        run: |
          set -euxo pipefail
          BOOST_ROOT="RHVoice/external/libs/boost"
          UNIFIED="$BOOST_ROOT/unified_include"
          rm -rf "$UNIFIED"
          mkdir -p "$UNIFIED/boost"
          for dir in "$BOOST_ROOT"/libs/*/include/boost; do
            if [ -d "$dir" ]; then
              rsync -a "$dir/" "$UNIFIED/boost/"
            fi
          done

      - name: Generate Xcode project
        working-directory: UkrainianVoicesApp
        run: xcodegen generate

      - name: Archive and export signed macOS app
        env:
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          xcodebuild \
            -project UkrainianVoices.xcodeproj \
            -scheme UkrainianVoicesMac \
            -configuration Release \
            -destination "platform=macOS,arch=x86_64" \
            -derivedDataPath build_sparkle \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$SPARKLE_SHORT_VERSION" \
            CURRENT_PROJECT_VERSION="$SPARKLE_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            clean archive \
            -archivePath build_sparkle/UkrainianVoicesMac.xcarchive

          mkdir -p build_sparkle/export
          cp -R build_sparkle/UkrainianVoicesMac.xcarchive/Products/Applications/UkrainianVoicesMac.app build_sparkle/export/

      - name: Sign macOS app manually
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_sparkle/export/UkrainianVoicesMac.app"
          EXT_PATH="$APP_PATH/Contents/PlugIns/UkrainianVoicesExtensionMac.appex"
          SPARKLE_PATH="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          test -d "$APP_PATH"
          test -d "$EXT_PATH"

          if [ -d "$SPARKLE_PATH" ]; then
            while IFS= read -r item; do
              codesign --force --timestamp --options runtime --sign "$MACOS_CODE_SIGN_IDENTITY" "$item"
            done < <(find "$SPARKLE_PATH" -type f -perm -111 -print | sort -r)

            while IFS= read -r item; do
              codesign --force --timestamp --options runtime --sign "$MACOS_CODE_SIGN_IDENTITY" "$item"
            done < <(find "$SPARKLE_PATH" \( -name "*.xpc" -o -name "*.app" \) -print | sort -r)

            codesign --force --timestamp --options runtime --sign "$MACOS_CODE_SIGN_IDENTITY" "$SPARKLE_PATH"
          fi

          while IFS= read -r item; do
            codesign --force --timestamp --options runtime --sign "$MACOS_CODE_SIGN_IDENTITY" "$item"
          done < <(find "$APP_PATH" \( -name "*.framework" -o -name "*.dylib" -o -name "*.xpc" \) -print | sort -r)

          codesign --force --timestamp --options runtime \
            --entitlements Extension/UkrainianVoicesExtensionMac.entitlements \
            --sign "$MACOS_CODE_SIGN_IDENTITY" "$EXT_PATH"

          codesign --force --timestamp --options runtime \
            --entitlements App/UkrainianVoicesMac.entitlements \
            --sign "$MACOS_CODE_SIGN_IDENTITY" "$APP_PATH"

      - name: Validate signed macOS artifact
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_sparkle/export/UkrainianVoicesMac.app"
          EXT_PATH="$APP_PATH/Contents/PlugIns/UkrainianVoicesExtensionMac.appex"
          bash ../scripts/validate_macos_artifact.sh "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$EXT_PATH"
          /usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :SUAutomaticallyUpdate' "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :SUEnableAutomaticChecks' "$APP_PATH/Contents/Info.plist"

      - name: Package signed macOS app for notarization
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_sparkle/export/UkrainianVoicesMac.app"
          mkdir -p ../mac_sparkle_build
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../mac_sparkle_build/UkrainianVoicesMac.app.notary.zip

      - name: Notarize signed macOS app
        run: |
          set -euxo pipefail
          ZIP_PATH="mac_sparkle_build/UkrainianVoicesMac.app.notary.zip"
          SUBMISSION_JSON="$RUNNER_TEMP/notary-submit.json"
          xcrun notarytool submit "$ZIP_PATH" \
            --key "$ASC_API_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait \
            --output-format json > "$SUBMISSION_JSON"
          /usr/bin/python3 - <<'PY' "$SUBMISSION_JSON"
          import json
          import sys
          status = json.load(open(sys.argv[1])).get("status")
          if status != "Accepted":
              raise SystemExit(f"Notarization status: {status}")
          PY

      - name: Staple notarization and package final artifact
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_sparkle/export/UkrainianVoicesMac.app"
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "../mac_sparkle_build/$SPARKLE_ASSET_NAME"
          shasum -a 256 "../mac_sparkle_build/$SPARKLE_ASSET_NAME" | tee ../mac_sparkle_build/sha256.txt

      - name: Download Sparkle tools
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          SIGN_UPDATE="$(find "$RUNNER_TEMP/sparkle" -name sign_update -type f -print -quit)"
          test -x "$SIGN_UPDATE"
          echo "SIGN_UPDATE=$SIGN_UPDATE" >> "$GITHUB_ENV"

      - name: Sign Sparkle update zip
        env:
          SPARKLE_ED25519_PRIVATE: ${{ secrets.SPARKLE_ED25519_PRIVATE }}
        run: |
          set -euxo pipefail
          ZIP_PATH="mac_sparkle_build/$SPARKLE_ASSET_NAME"
          test -n "$SPARKLE_ED25519_PRIVATE"
          SIGN_OUTPUT="$(printf '%s\n' "$SPARKLE_ED25519_PRIVATE" | "$SIGN_UPDATE" --ed-key-file - "$ZIP_PATH")"
          echo "$SIGN_OUTPUT"
          /usr/bin/python3 - <<'PY' "$SIGN_OUTPUT" "$GITHUB_ENV"
          import re
          import sys
          output, env_path = sys.argv[1:]
          sig = re.search(r'sparkle:edSignature="([^"]+)"', output)
          length = re.search(r'length="([0-9]+)"', output)
          if not sig or not length:
              raise SystemExit(f"Could not parse sign_update output: {output}")
          with open(env_path, "a") as env:
              env.write(f"SPARKLE_ED_SIGNATURE={sig.group(1)}\n")
              env.write(f"SPARKLE_LENGTH={length.group(1)}\n")
          PY

      - name: Upload signed Sparkle artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-sparkle-signed-build
          path: |
            ${{ github.workspace }}/mac_sparkle_build/${{ env.SPARKLE_ASSET_NAME }}
            ${{ github.workspace }}/mac_sparkle_build/sha256.txt
          retention-days: 7

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ZIP_PATH="mac_sparkle_build/$SPARKLE_ASSET_NAME"
          if ! gh release view "$SPARKLE_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$SPARKLE_RELEASE_TAG" \
              --title "Ukrainian Voices Mac $SPARKLE_SHORT_VERSION ($SPARKLE_BUILD_NUMBER)" \
              --notes "Signed and notarized Sparkle update for Ukrainian Voices Mac testers."
          fi
          gh release upload "$SPARKLE_RELEASE_TAG" "$ZIP_PATH#$SPARKLE_ASSET_NAME" --clobber
          echo "SPARKLE_DOWNLOAD_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${SPARKLE_RELEASE_TAG}/${SPARKLE_ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Update gh-pages appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          PAGES_DIR="$RUNNER_TEMP/gh-pages"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "$PAGES_DIR" origin/gh-pages
            git -C "$PAGES_DIR" checkout -B gh-pages
          else
            git worktree add --detach "$PAGES_DIR"
            git -C "$PAGES_DIR" checkout --orphan gh-pages
            git -C "$PAGES_DIR" rm -rf . || true
          fi

          /usr/bin/python3 - <<'PY' "$PAGES_DIR/appcast.xml"
          import datetime
          import os
          import sys
          import xml.sax.saxutils as sax

          path = sys.argv[1]
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%a, %d %b %Y %H:%M:%S %z")
          url = os.environ["SPARKLE_DOWNLOAD_URL"]
          version = os.environ["SPARKLE_SHORT_VERSION"]
          build = os.environ["SPARKLE_BUILD_NUMBER"]
          sig = os.environ["SPARKLE_ED_SIGNATURE"]
          length = os.environ["SPARKLE_LENGTH"]
          xml = f'''<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0"
               xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle"
               xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Ukrainian Voices Mac Updates</title>
              <link>https://abuten1977-design.github.io/RHVoiceUkraine/appcast.xml</link>
              <description>Signed macOS updates for Ukrainian Voices testers.</description>
              <language>uk</language>
              <item>
                <title>Ukrainian Voices Mac {sax.escape(version)} ({sax.escape(build)})</title>
                <pubDate>{now}</pubDate>
                <sparkle:version>{sax.escape(build)}</sparkle:version>
                <sparkle:shortVersionString>{sax.escape(version)}</sparkle:shortVersionString>
                <enclosure url="{sax.escape(url)}"
                           sparkle:edSignature="{sax.escape(sig)}"
                           length="{sax.escape(length)}"
                           type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          '''
          open(path, "w", encoding="utf-8").write("\n".join(line.strip() for line in xml.splitlines() if line.strip()) + "\n")
          PY

          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add appcast.xml
          git -C "$PAGES_DIR" commit -m "Update Sparkle appcast for $SPARKLE_SHORT_VERSION ($SPARKLE_BUILD_NUMBER)"
          git -C "$PAGES_DIR" push origin gh-pages

      - name: Summary
        run: |
          {
            echo "## Sparkle macOS signed build ready"
            echo ""
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${SPARKLE_RELEASE_TAG}"
            echo "- Zip: ${SPARKLE_DOWNLOAD_URL}"
            echo "- Appcast: https://abuten1977-design.github.io/RHVoiceUkraine/appcast.xml"
            echo "- Sparkle version: ${SPARKLE_SHORT_VERSION} (${SPARKLE_BUILD_NUMBER})"
            echo "- Sparkle public key: \`YWIoGYUkCL3wX/rglOlXvntETvx/9aDS6huZY4/YD6o=\`"
          } >> "$GITHUB_STEP_SUMMARY"
