name: Build RHVoice Mac (Signed)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-rhvoice-mac-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac-signed:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install build tools
        run: brew install xcodegen

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euxo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
          MACOS_CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/rhvoice-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$MACOS_CODESIGN_P12_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CODESIGN_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[ "]//g')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "MACOS_CODE_SIGN_IDENTITY=$MACOS_CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Install provisioning profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
          EXT_PROFILE_BASE64: ${{ secrets.MACOS_EXT_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/uv_mac_app.mobileprovision"
          echo "$EXT_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/uv_mac_ext.mobileprovision"

          if /usr/bin/security cms -D -i "$RUNNER_TEMP/uv_mac_app.mobileprovision" > "$RUNNER_TEMP/uv_mac_app.plist" 2>/dev/null &&
             /usr/bin/security cms -D -i "$RUNNER_TEMP/uv_mac_ext.mobileprovision" > "$RUNNER_TEMP/uv_mac_ext.plist" 2>/dev/null; then
            APP_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/uv_mac_app.plist")
            EXT_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/uv_mac_ext.plist")
            APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/uv_mac_app.plist" 2>/dev/null || true)
            EXT_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/uv_mac_ext.plist" 2>/dev/null || true)

            if [[ "$APP_ID" != "${TEAM_ID}.com.rhvoice.UkrainianVoices.mac" ||
                  "$EXT_ID" != "${TEAM_ID}.com.rhvoice.UkrainianVoices.mac.Extension" ]]; then
              echo "Provisioning profile secrets do not match current macOS bundle IDs/team; continuing without explicit profile UUIDs."
              echo "UV_MAC_APP_PROFILE_UUID=" >> "$GITHUB_ENV"
              echo "UV_MAC_EXT_PROFILE_UUID=" >> "$GITHUB_ENV"
              exit 0
            fi

            cp "$RUNNER_TEMP/uv_mac_app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$APP_UUID.mobileprovision"
            cp "$RUNNER_TEMP/uv_mac_ext.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$EXT_UUID.mobileprovision"

            echo "UV_MAC_APP_PROFILE_UUID=$APP_UUID" >> "$GITHUB_ENV"
            echo "UV_MAC_EXT_PROFILE_UUID=$EXT_UUID" >> "$GITHUB_ENV"
          else
            echo "Provisioning profile secrets are not parseable; continuing without explicit profile UUIDs."
            echo "UV_MAC_APP_PROFILE_UUID=" >> "$GITHUB_ENV"
            echo "UV_MAC_EXT_PROFILE_UUID=" >> "$GITHUB_ENV"
          fi

      - name: Create Boost unified include
        run: |
          set -euxo pipefail
          BOOST_ROOT="RHVoice/external/libs/boost"
          UNIFIED="$BOOST_ROOT/unified_include"
          rm -rf "$UNIFIED"
          mkdir -p "$UNIFIED/boost"
          for dir in "$BOOST_ROOT"/libs/*/include/boost; do
            if [ -d "$dir" ]; then
              rsync -a "$dir/" "$UNIFIED/boost/"
            fi
          done
          echo "Boost unified: $(find "$UNIFIED/boost/" -maxdepth 1 | wc -l) top-level entries"

      - name: Generate Xcode project
        working-directory: UkrainianVoicesApp
        run: xcodegen generate

      - name: Archive and export signed macOS app
        env:
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          xcodebuild \
            -project UkrainianVoices.xcodeproj \
            -scheme UkrainianVoicesMac \
            -configuration Release \
            -destination "platform=macOS,arch=x86_64" \
            -derivedDataPath build_signed \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="$MACOS_CODE_SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            clean archive \
            -archivePath build_signed/UkrainianVoicesMac.xcarchive

          mkdir -p build_signed/export
          cp -R build_signed/UkrainianVoicesMac.xcarchive/Products/Applications/UkrainianVoicesMac.app build_signed/export/

      - name: Validate signed macOS artifact (static + signature gate)
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_signed/export/UkrainianVoicesMac.app"
          test -d "$APP_PATH"

          EXT_PATH="$APP_PATH/Contents/PlugIns/UkrainianVoicesExtensionMac.appex"

          bash ../scripts/validate_macos_artifact.sh "$APP_PATH"

          if find "$APP_PATH" -name "libRHVoice*.dylib" | grep -q .; then
            echo "❌ FAIL: legacy RHVoice dylibs found in app bundle"
            find "$APP_PATH" -name "libRHVoice*.dylib"
            exit 1
          fi
          echo "✅ No RHVoice dylibs in app bundle — RHVoice C/C++ is compiled into RHVoiceKitMac"

          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$EXT_PATH"

          APP_ENT="$(codesign -d --entitlements :- "$APP_PATH" 2>/dev/null || true)"
          EXT_ENT="$(codesign -d --entitlements :- "$EXT_PATH" 2>/dev/null || true)"
          echo "$APP_ENT"
          echo "$EXT_ENT"
          echo "$APP_ENT" | grep -q "group.rhvoice.UkrainianVoices.shared"
          echo "$EXT_ENT" | grep -q "group.rhvoice.UkrainianVoices.shared"
          echo "$APP_ENT" | grep -q "com.apple.security.app-sandbox"
          echo "$EXT_ENT" | grep -q "com.apple.security.app-sandbox"

      - name: Package signed macOS app for notarization
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_signed/export/UkrainianVoicesMac.app"
          test -d "$APP_PATH"
          mkdir -p ../mac_signed_build
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../mac_signed_build/UkrainianVoicesMac.app.notary.zip
          ls -la ../mac_signed_build/UkrainianVoicesMac.app.notary.zip

      - name: Notarize signed macOS app
        run: |
          set -euxo pipefail
          xcrun notarytool submit mac_signed_build/UkrainianVoicesMac.app.notary.zip \
            --key "$ASC_API_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait

      - name: Staple notarization and package final artifact
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_signed/export/UkrainianVoicesMac.app"
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$APP_PATH"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 65
            fi
            sleep 30
          done
          xcrun stapler validate "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../mac_signed_build/UkrainianVoicesMac.app.zip
          ls -la ../mac_signed_build/UkrainianVoicesMac.app.zip

      - name: Upload signed macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-signed-build
          path: ${{ github.workspace }}/mac_signed_build/UkrainianVoicesMac.app.zip
          retention-days: 3

      - name: Summary
        run: |
          {
            echo "## macOS signed build ready"
            echo ""
            echo "- Artifact: \`macos-signed-build\`"
            echo "- Signing: Xcode automatic signing with App Store Connect API key"
            echo "- Notarization: App Store Connect API key + notarytool"
            echo "- Scheme: \`UkrainianVoicesMac\` (x86_64)"
            echo "- Architecture gate: no \`libRHVoice*.dylib\` in the app bundle"
            echo ""
            echo "Required secrets:"
            echo "- \`MACOS_TEAM_ID\`"
            echo "- \`ASC_API_KEY_BASE64\`"
            echo "- \`ASC_KEY_ID\`"
            echo "- \`ASC_ISSUER_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
