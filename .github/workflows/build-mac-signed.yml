name: Build RHVoice Mac (Signed)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-rhvoice-mac-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac-signed:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install build tools
        run: brew install xcodegen

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}

      - name: Install provisioning profiles (app + extension)
        env:
          APP_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
          EXT_PROFILE_BASE64: ${{ secrets.MACOS_EXT_PROFILE_BASE64 }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$APP_PROFILE_BASE64" | base64 --decode > /tmp/uv_mac_app.mobileprovision
          echo "$EXT_PROFILE_BASE64" | base64 --decode > /tmp/uv_mac_ext.mobileprovision

          APP_UUID=$(/usr/bin/security cms -D -i /tmp/uv_mac_app.mobileprovision | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          EXT_UUID=$(/usr/bin/security cms -D -i /tmp/uv_mac_ext.mobileprovision | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)

          cp /tmp/uv_mac_app.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$APP_UUID.mobileprovision"
          cp /tmp/uv_mac_ext.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$EXT_UUID.mobileprovision"

          echo "UV_MAC_APP_PROFILE_UUID=$APP_UUID" >> "$GITHUB_ENV"
          echo "UV_MAC_EXT_PROFILE_UUID=$EXT_UUID" >> "$GITHUB_ENV"

          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Create Boost unified include
        run: |
          set -euxo pipefail
          BOOST_ROOT="RHVoice/external/libs/boost"
          UNIFIED="$BOOST_ROOT/unified_include"
          rm -rf "$UNIFIED"
          mkdir -p "$UNIFIED/boost"
          for dir in "$BOOST_ROOT"/libs/*/include/boost; do
            if [ -d "$dir" ]; then
              rsync -a "$dir/" "$UNIFIED/boost/"
            fi
          done
          echo "Boost unified: $(find "$UNIFIED/boost/" -maxdepth 1 | wc -l) top-level entries"

      - name: Generate Xcode project
        working-directory: UkrainianVoicesApp
        run: xcodegen generate

      - name: Archive signed macOS app
        env:
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          SIGN_ID: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          xcodebuild \
            -scheme UkrainianVoicesMac \
            -configuration Release \
            -destination "platform=macOS,arch=x86_64" \
            -derivedDataPath build_signed \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_ID" \
            UV_MAC_APP_PROFILE_UUID="$UV_MAC_APP_PROFILE_UUID" \
            UV_MAC_EXT_PROFILE_UUID="$UV_MAC_EXT_PROFILE_UUID" \
            clean archive \
            -archivePath build_signed/UkrainianVoicesMac.xcarchive

      - name: Validate signed macOS artifact (static + signature gate)
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_signed/UkrainianVoicesMac.xcarchive/Products/Applications/UkrainianVoicesMac.app"
          test -d "$APP_PATH"

          EXT_PATH="$APP_PATH/Contents/PlugIns/UkrainianVoicesExtensionMac.appex"

          bash ../scripts/validate_macos_artifact.sh "$APP_PATH"

          if find "$APP_PATH" -name "libRHVoice*.dylib" | grep -q .; then
            echo "❌ FAIL: legacy RHVoice dylibs found in app bundle"
            find "$APP_PATH" -name "libRHVoice*.dylib"
            exit 1
          fi
          echo "✅ No RHVoice dylibs in app bundle — RHVoice C/C++ is compiled into RHVoiceKitMac"

          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$EXT_PATH"

          APP_ENT="$(codesign -d --entitlements :- "$APP_PATH" 2>/dev/null || true)"
          EXT_ENT="$(codesign -d --entitlements :- "$EXT_PATH" 2>/dev/null || true)"
          echo "$APP_ENT"
          echo "$EXT_ENT"
          echo "$APP_ENT" | grep -q "group.rhvoice.UkrainianVoices.shared"
          echo "$EXT_ENT" | grep -q "group.rhvoice.UkrainianVoices.shared"
          echo "$APP_ENT" | grep -q "com.apple.security.app-sandbox"
          echo "$EXT_ENT" | grep -q "com.apple.security.app-sandbox"

      - name: Package signed macOS app for notarization
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_signed/UkrainianVoicesMac.xcarchive/Products/Applications/UkrainianVoicesMac.app"
          test -d "$APP_PATH"
          mkdir -p ../mac_signed_build
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../mac_signed_build/UkrainianVoicesMac.app.notary.zip
          ls -la ../mac_signed_build/UkrainianVoicesMac.app.notary.zip

      - name: Notarize signed macOS app
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euxo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          xcrun notarytool submit mac_signed_build/UkrainianVoicesMac.app.notary.zip \
            --key "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait

      - name: Staple notarization and package final artifact
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_signed/UkrainianVoicesMac.xcarchive/Products/Applications/UkrainianVoicesMac.app"
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../mac_signed_build/UkrainianVoicesMac.app.zip
          ls -la ../mac_signed_build/UkrainianVoicesMac.app.zip

      - name: Upload signed macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-signed-build
          path: ${{ github.workspace }}/mac_signed_build/UkrainianVoicesMac.app.zip
          retention-days: 3

      - name: Summary
        run: |
          {
            echo "## macOS signed build ready"
            echo ""
            echo "- Artifact: \`macos-signed-build\`"
            echo "- Signing: Manual (certificate + provisioning profiles)"
            echo "- Notarization: App Store Connect API key + notarytool"
            echo "- Scheme: \`UkrainianVoicesMac\` (x86_64)"
            echo "- Architecture gate: no \`libRHVoice*.dylib\` in the app bundle"
            echo ""
            echo "Required secrets:"
            echo "- \`MACOS_CODESIGN_P12_BASE64\`"
            echo "- \`MACOS_CODESIGN_P12_PASSWORD\`"
            echo "- \`MACOS_APP_PROFILE_BASE64\` (macOS App profile for \`com.rhvoice.UkrainianVoices.mac\`)"
            echo "- \`MACOS_EXT_PROFILE_BASE64\` (macOS App Extension profile for \`com.rhvoice.UkrainianVoices.mac.Extension\`)"
            echo "- \`MACOS_TEAM_ID\`"
            echo "- \`MACOS_CODE_SIGN_IDENTITY\`"
            echo "- \`ASC_API_KEY_BASE64\`"
            echo "- \`ASC_KEY_ID\`"
            echo "- \`ASC_ISSUER_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
