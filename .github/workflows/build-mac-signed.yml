name: Build RHVoice Mac (Signed)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-rhvoice-mac-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac-signed:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install build tools
        run: brew install xcodegen

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euxo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
          MACOS_CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/rhvoice-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$MACOS_CODESIGN_P12_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CODESIGN_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[ "]//g')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "MACOS_CODE_SIGN_IDENTITY=$MACOS_CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Create Boost unified include
        run: |
          set -euxo pipefail
          BOOST_ROOT="RHVoiceCore/RHVoice/external/libs/boost"
          UNIFIED="$BOOST_ROOT/unified_include"
          rm -rf "$UNIFIED"
          mkdir -p "$UNIFIED/boost"
          for dir in "$BOOST_ROOT"/libs/*/include/boost; do
            if [ -d "$dir" ]; then
              rsync -a "$dir/" "$UNIFIED/boost/"
            fi
          done
          echo "Boost unified: $(find "$UNIFIED/boost/" -maxdepth 1 | wc -l) top-level entries"

      - name: Generate Xcode project
        working-directory: UkrainianVoicesApp
        run: xcodegen generate

      - name: Archive and export signed macOS app
        env:
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          xcodebuild \
            -project UkrainianVoices.xcodeproj \
            -scheme UkrainianVoicesMac \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build_signed \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            clean archive \
            -archivePath build_signed/UkrainianVoicesMac.xcarchive

          mkdir -p build_signed/export
          cp -R build_signed/UkrainianVoicesMac.xcarchive/Products/Applications/UkrainianVoicesMac.app build_signed/export/

      - name: Sign macOS app manually
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_signed/export/UkrainianVoicesMac.app"
          EXT_PATH="$APP_PATH/Contents/PlugIns/UkrainianVoicesExtensionMac.appex"
          test -d "$APP_PATH"
          test -d "$EXT_PATH"

          while IFS= read -r item; do
            codesign --force --timestamp --options runtime --generate-entitlement-der --sign "$MACOS_CODE_SIGN_IDENTITY" "$item"
          done < <(find "$APP_PATH" \( -name "*.framework" -o -name "*.dylib" \) -print | sort -r)

          codesign --force --timestamp --options runtime --generate-entitlement-der \
            --entitlements Extension/UkrainianVoicesExtensionMac.entitlements \
            --sign "$MACOS_CODE_SIGN_IDENTITY" "$EXT_PATH"

          codesign --force --timestamp --options runtime --generate-entitlement-der \
            --entitlements App/UkrainianVoicesMac.entitlements \
            --sign "$MACOS_CODE_SIGN_IDENTITY" "$APP_PATH"

      - name: Validate signed macOS artifact (static + signature gate)
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_signed/export/UkrainianVoicesMac.app"
          test -d "$APP_PATH"

          EXT_PATH="$APP_PATH/Contents/PlugIns/UkrainianVoicesExtensionMac.appex"
          EXPECTED_GROUP_ID="5NNZPP8CRR.group.rhvoice.UkrainianVoices.shared"

          bash ../scripts/validate_macos_artifact.sh "$APP_PATH"

          if find "$APP_PATH" -name "libRHVoice*.dylib" | grep -q .; then
            echo "❌ FAIL: legacy RHVoice dylibs found in app bundle"
            find "$APP_PATH" -name "libRHVoice*.dylib"
            exit 1
          fi
          echo "✅ No RHVoice dylibs in app bundle — RHVoice C/C++ is compiled into RHVoiceKitMac"

          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$EXT_PATH"

          APP_ENT="$RUNNER_TEMP/uv-mac-app-entitlements.txt"
          EXT_ENT="$RUNNER_TEMP/uv-mac-ext-entitlements.txt"
          codesign -d --entitlements - "$APP_PATH" > "$APP_ENT" 2>"$APP_ENT.stderr"
          codesign -d --entitlements - "$EXT_PATH" > "$EXT_ENT" 2>"$EXT_ENT.stderr"
          ! grep -qi "invalid entitlements" "$APP_ENT.stderr"
          ! grep -qi "invalid entitlements" "$EXT_ENT.stderr"
          cat "$APP_ENT"
          cat "$EXT_ENT"
          grep -q "$EXPECTED_GROUP_ID" "$APP_ENT"
          grep -q "$EXPECTED_GROUP_ID" "$EXT_ENT"
          grep -q "com.apple.security.app-sandbox" "$APP_ENT"
          grep -q "com.apple.security.app-sandbox" "$EXT_ENT"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$EXT_PATH"

      - name: Package signed macOS app for notarization
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_signed/export/UkrainianVoicesMac.app"
          test -d "$APP_PATH"
          mkdir -p ../mac_signed_build
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../mac_signed_build/UkrainianVoicesMac.app.notary.zip
          ls -la ../mac_signed_build/UkrainianVoicesMac.app.notary.zip

      - name: Upload pre-notarized signed macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-signed-prenotary-build
          path: ${{ github.workspace }}/mac_signed_build/UkrainianVoicesMac.app.notary.zip
          retention-days: 3

      - name: Notarize signed macOS app
        run: |
          set -euxo pipefail
          ZIP_PATH="mac_signed_build/UkrainianVoicesMac.app.notary.zip"
          ls -lh "$ZIP_PATH"
          du -h "$ZIP_PATH"

          HISTORY_BEFORE="$RUNNER_TEMP/notary-history-before.json"
          xcrun notarytool history \
            --key "$ASC_API_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --output-format json > "$HISTORY_BEFORE" || true
          BEFORE_ID="$(/usr/bin/python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)) if __import__("os").path.getsize(p) else {}; h=d.get("history") or []; print(h[0].get("id","") if h else "")' "$HISTORY_BEFORE")"
          echo "Previous notary submission id: ${BEFORE_ID:-none}"

          SUBMISSION_JSON="$RUNNER_TEMP/notary-submit.json"
          /usr/bin/python3 - "$ZIP_PATH" "$ASC_API_KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$SUBMISSION_JSON" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          zip_path, key_path, key_id, issuer_id, output_path = sys.argv[1:]
          cmd = [
              "xcrun", "notarytool", "submit", zip_path,
              "--key", key_path,
              "--key-id", key_id,
              "--issuer", issuer_id,
              "--no-wait",
              "--no-s3-acceleration",
              "--output-format", "json",
          ]
          with open(output_path, "wb") as out:
              proc = subprocess.Popen(
                  cmd,
                  stdout=out,
                  stderr=subprocess.STDOUT,
                  start_new_session=True,
              )
              try:
                  proc.wait(timeout=90)
              except subprocess.TimeoutExpired:
                  print("notarytool submit did not return after 90 seconds; continuing via history polling.", flush=True)
                  os.killpg(proc.pid, signal.SIGTERM)
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      os.killpg(proc.pid, signal.SIGKILL)
                      proc.wait()
          PY

          SUBMISSION_ID="$(/usr/bin/python3 - "$SUBMISSION_JSON" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          try:
              print(json.load(open(path)).get("id", "") if os.path.getsize(path) else "")
          except Exception:
              print("")
          PY
          )"
          if [ -z "$SUBMISSION_ID" ]; then
            for attempt in $(seq 1 12); do
              HISTORY_AFTER="$RUNNER_TEMP/notary-history-after-${attempt}.json"
              xcrun notarytool history \
                --key "$ASC_API_KEY_PATH" \
                --key-id "$ASC_KEY_ID" \
                --issuer "$ASC_ISSUER_ID" \
                --output-format json > "$HISTORY_AFTER"
              SUBMISSION_ID="$(/usr/bin/python3 -c 'import json,sys; before=sys.argv[2]; h=json.load(open(sys.argv[1])).get("history") or []; print(next((x.get("id","") for x in h if x.get("name")=="UkrainianVoicesMac.app.notary.zip" and x.get("id","") != before), ""))' "$HISTORY_AFTER" "$BEFORE_ID")"
              if [ -n "$SUBMISSION_ID" ]; then
                break
              fi
              sleep 10
            done
          fi
          test -n "$SUBMISSION_ID"
          echo "Notary submission id: $SUBMISSION_ID"

          for attempt in $(seq 1 60); do
            STATUS_JSON="$RUNNER_TEMP/notary-status-${attempt}.json"
            xcrun notarytool info "$SUBMISSION_ID" \
              --key "$ASC_API_KEY_PATH" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" \
              --output-format json > "$STATUS_JSON"
            STATUS="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$STATUS_JSON")"
            echo "Notary status attempt ${attempt}: ${STATUS}"

            case "$STATUS" in
              Accepted)
                exit 0
                ;;
              Invalid|Rejected)
                xcrun notarytool log "$SUBMISSION_ID" \
                  --key "$ASC_API_KEY_PATH" \
                  --key-id "$ASC_KEY_ID" \
                  --issuer "$ASC_ISSUER_ID"
                exit 65
                ;;
            esac

            sleep 30
          done

          echo "Notarization did not finish within 30 minutes."
          xcrun notarytool log "$SUBMISSION_ID" \
            --key "$ASC_API_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" || true
          exit 65

      - name: Staple notarization and package final artifact
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH="build_signed/export/UkrainianVoicesMac.app"
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$APP_PATH"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 65
            fi
            sleep 30
          done
          xcrun stapler validate "$APP_PATH"
          EXPECTED_GROUP_ID="5NNZPP8CRR.group.rhvoice.UkrainianVoices.shared"
          EXT_PATH="$APP_PATH/Contents/PlugIns/UkrainianVoicesExtensionMac.appex"
          APP_ENT="$RUNNER_TEMP/uv-mac-app-entitlements-stapled.txt"
          EXT_ENT="$RUNNER_TEMP/uv-mac-ext-entitlements-stapled.txt"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$EXT_PATH"
          codesign -d --entitlements - "$APP_PATH" > "$APP_ENT" 2>"$APP_ENT.stderr"
          codesign -d --entitlements - "$EXT_PATH" > "$EXT_ENT" 2>"$EXT_ENT.stderr"
          ! grep -qi "invalid entitlements" "$APP_ENT.stderr"
          ! grep -qi "invalid entitlements" "$EXT_ENT.stderr"
          grep -q "$EXPECTED_GROUP_ID" "$APP_ENT"
          grep -q "$EXPECTED_GROUP_ID" "$EXT_ENT"
          grep -q "com.apple.security.app-sandbox" "$APP_ENT"
          grep -q "com.apple.security.app-sandbox" "$EXT_ENT"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$EXT_PATH"
          SPCTL_APP="$RUNNER_TEMP/UkrainianVoicesMac-spctl.app"
          rm -rf "$SPCTL_APP"
          ditto "$APP_PATH" "$SPCTL_APP"
          spctl --assess --type execute --verbose=4 "$SPCTL_APP"
          rm -rf "$SPCTL_APP"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$EXT_PATH"
          codesign -d --entitlements - "$APP_PATH" > "$APP_ENT" 2>"$APP_ENT.stderr"
          codesign -d --entitlements - "$EXT_PATH" > "$EXT_ENT" 2>"$EXT_ENT.stderr"
          ! grep -qi "invalid entitlements" "$APP_ENT.stderr"
          ! grep -qi "invalid entitlements" "$EXT_ENT.stderr"
          grep -q "$EXPECTED_GROUP_ID" "$APP_ENT"
          grep -q "$EXPECTED_GROUP_ID" "$EXT_ENT"
          grep -q "com.apple.security.app-sandbox" "$APP_ENT"
          grep -q "com.apple.security.app-sandbox" "$EXT_ENT"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$EXT_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../mac_signed_build/UkrainianVoicesMac.app.zip
          ls -la ../mac_signed_build/UkrainianVoicesMac.app.zip

      - name: Upload signed macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-signed-build
          path: ${{ github.workspace }}/mac_signed_build/UkrainianVoicesMac.app.zip
          retention-days: 3

      - name: Summary
        run: |
          {
            echo "## macOS signed build ready"
            echo ""
            echo "- Artifact: \`macos-signed-build\`"
            echo "- Signing: Xcode automatic signing with App Store Connect API key"
            echo "- Notarization: App Store Connect API key + notarytool"
            echo "- Scheme: \`UkrainianVoicesMac\` (x86_64)"
            echo "- Architecture gate: no \`libRHVoice*.dylib\` in the app bundle"
            echo ""
            echo "Required secrets:"
            echo "- \`MACOS_TEAM_ID\`"
            echo "- \`ASC_API_KEY_BASE64\`"
            echo "- \`ASC_KEY_ID\`"
            echo "- \`ASC_ISSUER_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
