PBXPROJ
      
      - name: Build App
        run: |
          cd UkrainianVoicesApp
          xcodebuild -project UkrainianVoices.xcodeproj \
            -scheme UkrainianVoices \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
      
      - name: Create IPA
        run: |
          cd UkrainianVoicesApp
          mkdir -p Payload
          cp -r build/Release-iphoneos/UkrainianVoices.app Payload/
          zip -r UkrainianVoices.ipa Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UkrainianVoices-IPA
          path: UkrainianVoicesApp/UkrainianVoices.ipa
          retention-days: 30
