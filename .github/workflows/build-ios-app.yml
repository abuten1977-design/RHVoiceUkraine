name: Build iOS App

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'UkrainianVoicesApp/**'
      - '.github/workflows/build-ios-app.yml'
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Run Swift Tests
        run: |
          cd UkrainianVoicesApp/Extension
          swift test --enable-code-coverage
      
      - name: Generate Coverage
        run: |
          cd UkrainianVoicesApp/Extension
          xcrun llvm-cov export \
            .build/debug/UkrainianVoicesPackageTests.xctest/Contents/MacOS/UkrainianVoicesPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format="lcov" > coverage.lcov || true

  build-ipa:
    name: Build IPA for iPhone
    runs-on: macos-latest
    needs: test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Create Xcode Project
        run: |
          cd UkrainianVoicesApp
          
          # Create project structure
          mkdir -p UkrainianVoices.xcodeproj
          
          cat > UkrainianVoices.xcodeproj/project.pbxproj << 'PBXPROJ'
