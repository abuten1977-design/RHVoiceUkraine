name: Build RHVoiceKit.xcframework (iOS device + macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-rhvoicekit-xcframework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-xcframework:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: UkrainianVoicesApp
        run: xcodegen generate

      - name: Build RHVoiceKit (iOS device)
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          xcodebuild \
            -scheme RHVoiceKit \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_xcf \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build RHVoiceKitMac (macOS)
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          xcodebuild \
            -scheme RHVoiceKitMac \
            -configuration Release \
            -destination "platform=macOS,arch=x86_64" \
            -derivedDataPath build_xcf \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create RHVoiceKit.xcframework
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          IOS_FW="build_xcf/Build/Products/Release-iphoneos/RHVoiceKit.framework"
          MAC_FW="build_xcf/Build/Products/Release/RHVoiceKit.framework"
          test -d "$IOS_FW"
          test -d "$MAC_FW"

          rm -rf RHVoiceKit.xcframework
          xcodebuild -create-xcframework \
            -framework "$IOS_FW" \
            -framework "$MAC_FW" \
            -output RHVoiceKit.xcframework

          ditto -c -k --sequesterRsrc --keepParent RHVoiceKit.xcframework RHVoiceKit.xcframework.zip
          ls -la RHVoiceKit.xcframework.zip

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhvoicekit-xcframework
          path: UkrainianVoicesApp/RHVoiceKit.xcframework.zip
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "## RHVoiceKit.xcframework ready"
            echo ""
            echo "- Artifact: \`rhvoicekit-xcframework\`"
            echo "- Platforms: iOS (device), macOS (x86_64)"
            echo "- Signing: disabled (library artifact only)"
          } >> "$GITHUB_STEP_SUMMARY"
