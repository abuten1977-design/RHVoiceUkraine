name: Build RHVoice Ukraine

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Test
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        brew install cmake pkg-config boost
    
    - name: Build RHVoice Core
      run: |
        export BOOST_ROOT=$(brew --prefix boost)
        cd RHVoice
        mkdir -p build_macos
        cd build_macos
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_CXX_FLAGS="-I$(brew --prefix boost)/include"
        make -j$(sysctl -n hw.ncpu)
    
    - name: Build macOS Test
      run: |
        cd MacOSTest
        clang++ -std=c++11 \
          -I../RHVoice/src/include \
          -I$(brew --prefix boost)/include \
          minimal_rhvoice_test.cpp \
          ../RHVoice/build_macos/src/lib/libRHVoice.a \
          ../RHVoice/build_macos/src/lib/libRHVoice_core.a \
          ../RHVoice/build_macos/src/lib/libRHVoice_audio.a \
          -o rhvoice_test
    
    - name: Run Test
      run: |
        cd MacOSTest
        ./rhvoice_test || echo "Test failed but continuing"
    
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-test
        path: |
          MacOSTest/rhvoice_test
          MacOSTest/*.wav
        retention-days: 7

  build-ios-device:
    name: Build iOS Device (arm64)
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        brew install cmake pkg-config boost
    
    - name: Build for iOS Device
      run: |
        export BOOST_ROOT=$(brew --prefix boost)
        cd RHVoice
        mkdir -p build_ios_device
        cd build_ios_device
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_CXX_FLAGS="-I$(brew --prefix boost)/include"
        make -j$(sysctl -n hw.ncpu)
    
    - name: Upload iOS libraries
      uses: actions/upload-artifact@v4
      with:
        name: ios-device-libs
        path: |
          RHVoice/build_ios_device/src/lib/*.a
        retention-days: 7

  report:
    name: Build Report
    runs-on: ubuntu-latest
    needs: [build-macos, build-ios-device]
    if: always()
    
    steps:
    - name: Report Status
      run: |
        echo "Build Summary:"
        echo "macOS Test: ${{ needs.build-macos.result }}"
        echo "iOS Device: ${{ needs.build-ios-device.result }}"
