name: Build iOS Ukrainian Synthesizer

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'RHVoiceUkrainianSynthesizer/**'
      - '.github/workflows/build-ios-synthesizer.yml'
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'
      
      - name: Build RHVoice Libraries
        run: |
          cd RHVoice
          mkdir -p build_ios_device
          cd build_ios_device
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON
          cmake --build . --config Release
      
      - name: Copy Libraries
        run: |
          mkdir -p RHVoiceUkrainianSynthesizer/Libraries
          cp RHVoice/build_ios_device/src/lib/libRHVoice.dylib \
             RHVoice/build_ios_device/src/core/libRHVoice_core.dylib \
             RHVoice/build_ios_device/src/audio/libRHVoice_audio.dylib \
             RHVoiceUkrainianSynthesizer/Libraries/
      
      - name: Run Swift Tests
        run: |
          cd RHVoiceUkrainianSynthesizer
          swift test --enable-code-coverage
      
      - name: Generate Coverage Report
        run: |
          cd RHVoiceUkrainianSynthesizer
          xcrun llvm-cov export \
            .build/debug/RHVoiceUkrainianSynthesizerPackageTests.xctest/Contents/MacOS/RHVoiceUkrainianSynthesizerPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format="lcov" > coverage.lcov
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./RHVoiceUkrainianSynthesizer/coverage.lcov
          flags: unittests
          name: codecov-umbrella

  build-extension:
    name: Build App Extension
    runs-on: macos-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'
      
      - name: Install Dependencies
        run: |
          brew install cmake boost
      
      - name: Build RHVoice Libraries (arm64)
        run: |
          cd RHVoice
          mkdir -p build_ios_device
          cd build_ios_device
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_CXX_FLAGS="-I$(brew --prefix boost)/include"
          cmake --build . --config Release
      
      - name: Copy Libraries
        run: |
          mkdir -p RHVoiceUkrainianSynthesizer/Libraries
          cp RHVoice/build_ios_device/src/lib/libRHVoice.dylib \
             RHVoice/build_ios_device/src/core/libRHVoice_core.dylib \
             RHVoice/build_ios_device/src/audio/libRHVoice_audio.dylib \
             RHVoiceUkrainianSynthesizer/Libraries/
      
      - name: List Libraries
        run: |
          ls -lh RHVoiceUkrainianSynthesizer/Libraries/
          file RHVoiceUkrainianSynthesizer/Libraries/*.dylib
      
      - name: Create Archive Structure
        run: |
          mkdir -p build/UkrainianVoices.appex
          cp -r RHVoiceUkrainianSynthesizer/Provider build/UkrainianVoices.appex/
          cp -r RHVoiceUkrainianSynthesizer/Bridge build/UkrainianVoices.appex/
          cp -r RHVoiceUkrainianSynthesizer/Resources build/UkrainianVoices.appex/
          cp -r RHVoiceUkrainianSynthesizer/Libraries build/UkrainianVoices.appex/
          cp RHVoiceUkrainianSynthesizer/Info.plist build/UkrainianVoices.appex/
      
      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ukrainian-voices-extension
          path: build/UkrainianVoices.appex
          retention-days: 7
      
      - name: Upload Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhvoice-ios-libraries-arm64
          path: RHVoiceUkrainianSynthesizer/Libraries/
          retention-days: 7

  build-summary:
    name: Build Summary
    runs-on: macos-latest
    needs: [test, build-extension]
    
    steps:
      - name: Summary
        run: |
          echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- ukrainian-voices-extension (App Extension)" >> $GITHUB_STEP_SUMMARY
          echo "- rhvoice-ios-libraries-arm64 (Libraries)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Create Xcode project with extension" >> $GITHUB_STEP_SUMMARY
          echo "3. Sign with developer account" >> $GITHUB_STEP_SUMMARY
          echo "4. Test on physical iPhone" >> $GITHUB_STEP_SUMMARY
