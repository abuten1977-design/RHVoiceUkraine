name: Build RHVoice Mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: UkrainianVoicesApp
        run: xcodegen generate

      - name: Build macOS app
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          xcodebuild \
            -scheme UkrainianVoicesMac \
            -configuration Debug \
            -destination "platform=macOS,arch=x86_64" \
            -derivedDataPath build \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package macOS app
        if: always()
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH=$(find build -name "UkrainianVoicesMac.app" -maxdepth 6 | head -1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "❌ App not found"
            find build -name "*.app" | head -10
            exit 1
          fi
          mkdir -p ../mac_build
          cp -r "$APP_PATH" ../mac_build/
          cd ../mac_build
          ditto -c -k --sequesterRsrc --keepParent UkrainianVoicesMac.app UkrainianVoicesMac.app.zip
          ls -la UkrainianVoicesMac.app.zip

      - name: Upload macOS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-debug-build
          path: ${{ github.workspace }}/mac_build/UkrainianVoicesMac.app.zip
          retention-days: 3
