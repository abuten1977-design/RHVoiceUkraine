name: Build RHVoice Mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install build tools
        run: brew install xcodegen cmake boost

      - name: Create Boost unified include
        run: |
          BOOST_ROOT="RHVoiceCore/RHVoice/external/libs/boost"
          UNIFIED="$BOOST_ROOT/unified_include"
          rm -rf "$UNIFIED"
          mkdir -p "$UNIFIED/boost"
          for dir in "$BOOST_ROOT"/libs/*/include/boost; do
            if [ -d "$dir" ]; then
              rsync -a "$dir/" "$UNIFIED/boost/"
            fi
          done
          echo "Boost unified: $(find "$UNIFIED/boost/" -maxdepth 1 | wc -l) top-level entries"

      - name: Generate Xcode project
        working-directory: UkrainianVoicesApp
        run: xcodegen generate

      - name: Build macOS app
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          xcodebuild \
            -project UkrainianVoices.xcodeproj \
            -scheme UkrainianVoicesMac \
            -configuration Debug \
            -destination "platform=macOS,arch=x86_64" \
            -derivedDataPath build \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -200

      - name: Verify no dylibs in app bundle
        if: always()
        working-directory: UkrainianVoicesApp
        run: |
          APP_PATH=$(find build -name "UkrainianVoicesMac.app" -maxdepth 6 | head -1)
          if [ -n "$APP_PATH" ]; then
            DYLIBS=$(find "$APP_PATH" -name "libRHVoice*.dylib" | head -5)
            if [ -n "$DYLIBS" ]; then
              echo "❌ FAIL: dylibs still present in bundle:"
              echo "$DYLIBS"
              exit 1
            else
              echo "✅ No RHVoice dylibs in bundle — C++ compiled from source"
            fi
          fi

      - name: Package macOS app
        if: always()
        working-directory: UkrainianVoicesApp
        run: |
          set -euxo pipefail
          APP_PATH=$(find build -name "UkrainianVoicesMac.app" -maxdepth 6 | head -1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "App not found"
            find build -name "*.app" | head -10
            exit 1
          fi
          mkdir -p ../mac_build
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../mac_build/UkrainianVoicesMac.app.zip
          ls -la ../mac_build/UkrainianVoicesMac.app.zip

      - name: Upload macOS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-debug-build
          path: ${{ github.workspace }}/mac_build/UkrainianVoicesMac.app.zip
          retention-days: 3
