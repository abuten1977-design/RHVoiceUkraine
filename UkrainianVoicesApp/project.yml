name: UkrainianVoices
options:
  bundleIdPrefix: com.rhvoice
  deploymentTarget:
    iOS: "16.0"

targets:
  UkrainianVoices:
    type: application
    platform: iOS
    sources:
      - App
    postBuildScripts:
      - name: Copy Voices
        script: |
          echo "📦 Copying Voices to bundle..."
          VOICES_SRC="${SRCROOT}/Extension/Resources/Voices"
          VOICES_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Voices"
          
          if [ -d "$VOICES_SRC" ]; then
            cp -r "$VOICES_SRC" "$VOICES_DST"
            echo "✅ Voices copied: $(find "$VOICES_DST" -type f | wc -l) files"
            ls -la "$VOICES_DST"
          else
            echo "❌ Voices not found: $VOICES_SRC"
            exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.UkrainianVoices
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: UkrainianVoicesExtension
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
    
  UkrainianVoicesExtension:
    type: app-extension
    platform: iOS
    sources:
      - Extension/Provider
      - Extension/Bridge
      - Extension/Models
      - Extension/Services
      - Extension/Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.UkrainianVoices.Extension
        INFOPLIST_FILE: Extension/Info.plist
        SWIFT_VERSION: "5.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        DEFINES_MODULE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridge/UkrainianVoices-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Extension/Libraries"
        OTHER_LDFLAGS: "-lRHVoice -lRHVoice_core -lRHVoice_audio"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
