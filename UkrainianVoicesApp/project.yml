name: UkrainianVoices
options:
  bundleIdPrefix: com.rhvoice
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"

packages:
  RHVoiceCore:
    path: ../RHVoiceCore

targets:
  RHVoiceKit:
    type: framework
    platform: iOS
    sources:
      - path: ../RHVoiceKit/Sources
    dependencies:
      - package: RHVoiceCore
        product: RHVoiceBridge
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
    headers:
      public:
        - ../RHVoiceKit/Sources/RHVoiceKit.h
        - ../RHVoiceKit/Sources/RHVoiceEngine.h
        - ../RHVoiceKit/Sources/RHVoiceEngine+Parameters.h
    settings:
      base:
        PRODUCT_NAME: RHVoiceKit
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.RHVoiceKit
        INFOPLIST_FILE: ../RHVoiceKit/Info.plist
        DEFINES_MODULE: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../RHVoiceKit/Sources $(SRCROOT)/../RHVoice/src/include"

  RHVoiceKitMac:
    type: framework
    platform: macOS
    sources:
      - path: ../RHVoiceKit/Sources
      - path: ../RHVoice/src/core
        excludes:
          - "CMakeLists.txt*"
          - "SConscript"
          - "config.h.in"
          - "emoji_data.cpp"
          - "unidata.cpp"
          - "userdict_parser.c"
      - path: ../RHVoice/src/lib
        excludes:
          - "CMakeLists.txt*"
          - "SConscript"
          - "lib.def"
      - path: ../RHVoice/src/hts_engine
        excludes:
          - "CMakeLists.txt*"
          - "SConscript"
      - path: ../RHVoice/src/audio
        excludes:
          - "CMakeLists.txt*"
          - "SConscript"
          - "libao.cpp"
          - "libao.hpp"
          - "portaudio.cpp"
          - "portaudio.hpp"
          - "pulse.cpp"
          - "pulse.hpp"
      - path: ../RHVoice/external/libs/sonic
        excludes:
          - "CMakeLists.txt*"
          - "SConscript"
          - "*.h"
          - "main.c"
          - "spectrogram.c"
          - "wave.c"
    resources:
      - path: Extension/Resources/RHVoiceData
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
    headers:
      public:
        - ../RHVoiceKit/Sources/RHVoiceKit.h
        - ../RHVoiceKit/Sources/RHVoiceEngine.h
        - ../RHVoiceKit/Sources/RHVoiceEngine+Parameters.h
    settings:
      base:
        PRODUCT_NAME: RHVoiceKit
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.RHVoiceKit
        INFOPLIST_FILE: ../RHVoiceKit/Info.plist
        DEFINES_MODULE: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../RHVoiceKit/Sources $(SRCROOT)/../RHVoice/src/include $(SRCROOT)/../RHVoice/src/include/core $(SRCROOT)/../RHVoice/src/hts_engine $(SRCROOT)/../RHVoice/src/core $(SRCROOT)/../RHVoice/src/audio $(SRCROOT)/../RHVoice/src/third-party/rapidxml $(SRCROOT)/../RHVoice/src/third-party/utf8 $(SRCROOT)/../RHVoice/external/libs/sonic $(SRCROOT)/../RHVoice/external/libs/boost/unified_include"
        GCC_PREPROCESSOR_DEFINITIONS: "ENABLE_SONIC=1 ENABLE_PKG=0"
        OTHER_CPLUSPLUSFLAGS: "-D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION -Wno-deprecated-declarations"
        GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: NO

  UkrainianVoices:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
        excludes:
          - Info.plist
    postBuildScripts:
      - name: Copy Voices
        script: |
          echo "📦 Copying RHVoiceData to bundle..."
          DATA_SRC="${SRCROOT}/Extension/Resources/RHVoiceData"
          DATA_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/RHVoiceData"
          
          if [ -d "$DATA_SRC" ]; then
            cp -r "$DATA_SRC" "$DATA_DST"
            echo "✅ RHVoiceData copied: $(find "$DATA_DST" -type f | wc -l) files"
            ls -la "$DATA_DST"
          else
            echo "❌ RHVoiceData not found: $DATA_SRC"
            exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.ukraine.app.5NNZPP8CRR
        INFOPLIST_FILE: App/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: App/UkrainianVoices.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5NNZPP8CRR"
    dependencies:
      - target: UkrainianVoicesExtension
      - package: RHVoiceCore
        product: RHVoiceBridge
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
    
  UkrainianVoicesExtension:
    type: app-extension
    platform: iOS
    sources:
      - Shared
      - Extension/Provider
    postBuildScripts:
      - name: Copy Voices to Extension
        script: |
          echo "📦 Copying RHVoiceData to Extension bundle..."
          DATA_SRC="${SRCROOT}/Extension/Resources/RHVoiceData"
          DATA_DST="${BUILT_PRODUCTS_DIR}/UkrainianVoicesExtension.appex/RHVoiceData"
          
          if [ -d "$DATA_SRC" ]; then
            cp -r "$DATA_SRC" "$DATA_DST"
            echo "✅ RHVoiceData copied to Extension: $(find "$DATA_DST" -type f | wc -l) files"
          else
            echo "❌ RHVoiceData not found: $DATA_SRC"
            exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.ukraine.app.5NNZPP8CRR.Extension
        INFOPLIST_FILE: Extension/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: Extension/UkrainianVoicesExtension.entitlements
        SWIFT_VERSION: "5.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        DEFINES_MODULE: YES
        OTHER_LDFLAGS: "$(inherited) -lc++"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5NNZPP8CRR"
    dependencies:
      - package: RHVoiceCore
        product: RHVoiceBridge
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework

  UkrainianVoicesMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: App
        excludes:
          - Info-iOS.plist
    postBuildScripts:
      - name: Copy RHVoiceData
        script: |
          echo "📦 Copying RHVoiceData to macOS bundle..."
          DATA_SRC="${SRCROOT}/Extension/Resources/RHVoiceData"
          DATA_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/RHVoiceData"
          
          if [ -d "$DATA_SRC" ]; then
            mkdir -p "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources"
            cp -r "$DATA_SRC" "$DATA_DST"
            echo "✅ RHVoiceData copied: $(find "$DATA_DST" -type f | wc -l) files"
          else
            echo "❌ RHVoiceData not found: $DATA_SRC"
            exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.UkrainianVoices.mac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/UkrainianVoicesMac.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # For CI / signed builds (e.g. GitHub Actions). Leave empty by default.
        # When set, Xcode embeds provisioning profile and restricted entitlements can be validated by macOS.
        PROVISIONING_PROFILE: "$(UV_MAC_APP_PROFILE_UUID)"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    dependencies:
      - target: UkrainianVoicesExtensionMac
      - target: RHVoiceKitMac
        embed: true
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework

  UkrainianVoicesExtensionMac:
    type: app-extension
    platform: macOS
    sources:
      - Shared
      - Extension/Provider
    postBuildScripts:
      - name: Copy RHVoiceData to Extension
        script: |
          echo "📦 Copying RHVoiceData to macOS extension bundle..."
          DATA_SRC="${SRCROOT}/Extension/Resources/RHVoiceData"
          EXT_PATH="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          DATA_DST="${EXT_PATH}/Contents/Resources/RHVoiceData"

          if [ ! -d "$DATA_SRC" ]; then
            echo "❌ RHVoiceData not found: $DATA_SRC"
            exit 1
          fi

          mkdir -p "${EXT_PATH}/Contents/Resources"
          rm -rf "$DATA_DST"
          cp -r "$DATA_SRC" "$DATA_DST"
          echo "✅ RHVoiceData copied to Extension: $(find "$DATA_DST" -type f | wc -l) files"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: RHVoiceKitMac
        embed: true
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreAudioKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.UkrainianVoices.mac.Extension
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/UkrainianVoicesExtensionMac.entitlements
        SWIFT_VERSION: "5.0"
        DEFINES_MODULE: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # For CI / signed builds (e.g. GitHub Actions). Leave empty by default.
        PROVISIONING_PROFILE: "$(UV_MAC_EXT_PROFILE_UUID)"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_DEBUG_DYLIB: NO
        GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
