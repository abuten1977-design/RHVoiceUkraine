name: UkrainianVoices
options:
  bundleIdPrefix: com.rhvoice
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"

targets:
  UkrainianVoices:
    type: application
    platform: iOS
    sources:
      - App
    postBuildScripts:
      - name: Copy Voices
        script: |
          echo "📦 Copying Voices to bundle..."
          VOICES_SRC="${SRCROOT}/Extension/Resources/Voices"
          VOICES_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Voices"
          
          if [ -d "$VOICES_SRC" ]; then
            cp -r "$VOICES_SRC" "$VOICES_DST"
            echo "✅ Voices copied: $(find "$VOICES_DST" -type f | wc -l) files"
            ls -la "$VOICES_DST"
          else
            echo "❌ Voices not found: $VOICES_SRC"
            exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.ukraine.app.5NNZPP8CRR
        INFOPLIST_FILE: App/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: UkrainianVoicesExtension
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
    
  UkrainianVoicesExtension:
    type: app-extension
    platform: iOS
    sources:
      - Extension/Provider
      - Extension/Bridge
      - Extension/Models
      - Extension/Services
      - Extension/Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.ukraine.app.5NNZPP8CRR.Extension
        INFOPLIST_FILE: Extension/Info-iOS.plist
        SWIFT_VERSION: "5.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        DEFINES_MODULE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridge/UkrainianVoices-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Extension/Libraries"
        OTHER_LDFLAGS: "-lRHVoice -lRHVoice_core -lRHVoice_audio"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework

  UkrainianVoicesMac:
    type: application
    platform: macOS
    sources:
      - App
    postBuildScripts:
      - name: Copy Voices
        script: |
          echo "📦 Copying Voices to macOS bundle..."
          VOICES_SRC="${SRCROOT}/Extension/Resources/Voices"
          VOICES_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/Voices"
          
          if [ -d "$VOICES_SRC" ]; then
            mkdir -p "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources"
            cp -r "$VOICES_SRC" "$VOICES_DST"
            echo "✅ Voices copied: $(find "$VOICES_DST" -type f | wc -l) files"
          else
            echo "❌ Voices not found: $VOICES_SRC"
            exit 1
          fi
        basedOnDependencyAnalysis: false
      - name: Embed RHVoice dylibs
        script: |
          echo "📦 Embedding macOS RHVoice dylibs..."
          DYLIB_SRC="${SRCROOT}/Extension/Libraries_macos_x86_64"
          DYLIB_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Frameworks"

          mkdir -p "$DYLIB_DST"

          for lib in libRHVoice.dylib libRHVoice_core.dylib libRHVoice_audio.dylib; do
            if [ ! -f "$DYLIB_SRC/$lib" ]; then
              echo "❌ Missing macOS dylib: $DYLIB_SRC/$lib"
              exit 1
            fi
            cp -f "$DYLIB_SRC/$lib" "$DYLIB_DST/$lib"
            echo "✅ Embedded $lib"
          done
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.UkrainianVoices.mac
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    dependencies:
      - target: UkrainianVoicesExtensionMac
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework

  UkrainianVoicesExtensionMac:
    type: app-extension
    platform: macOS
    sources:
      - Extension/Provider
      - Extension/Bridge
      - Extension/Models
      - Extension/Services
      - Extension/Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.UkrainianVoices.Extension.mac
        INFOPLIST_FILE: Extension/Info.plist
        SWIFT_VERSION: "5.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridge/UkrainianVoices-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Extension/Libraries_macos_x86_64"
        OTHER_LDFLAGS: "-lRHVoice -lRHVoice_core -lRHVoice_audio"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
    postBuildScripts:
      - name: Embed RHVoice dylibs in extension
        script: |
          echo "📦 Embedding RHVoice dylibs in extension..."
          DYLIB_SRC="${SRCROOT}/Extension/Libraries_macos_x86_64"
          DYLIB_DST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Frameworks"

          mkdir -p "$DYLIB_DST"

          for lib in libRHVoice.dylib libRHVoice_core.dylib libRHVoice_audio.dylib; do
            if [ ! -f "$DYLIB_SRC/$lib" ]; then
              echo "❌ Missing macOS dylib: $DYLIB_SRC/$lib"
              exit 1
            fi
            cp -f "$DYLIB_SRC/$lib" "$DYLIB_DST/$lib"
            echo "✅ Embedded $lib into extension"
          done
        basedOnDependencyAnalysis: false
