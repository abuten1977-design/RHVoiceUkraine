name: UkrainianVoices
options:
  bundleIdPrefix: com.rhvoice
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"

targets:
  RHVoiceKitMac:
    type: framework
    platform: macOS
    sources:
      - path: ../RHVoiceKit/Sources
    resources:
      - path: Extension/Resources/RHVoiceData
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
    headers:
      public:
        - ../RHVoiceKit/Sources/RHVoiceKit.h
        - ../RHVoiceKit/Sources/RHVoiceEngine.h
        - ../RHVoiceKit/Sources/RHVoiceEngine+Parameters.h
    settings:
      base:
        PRODUCT_NAME: RHVoiceKit
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.RHVoiceKit
        INFOPLIST_FILE: ../RHVoiceKit/Info.plist
        DEFINES_MODULE: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../RHVoiceKit/Sources $(SRCROOT)/../RHVoice/src/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Extension/Libraries_macos_x86_64 $(SRCROOT)/Extension/Libraries_macos_arm64"
        OTHER_LDFLAGS: "-lRHVoice -lRHVoice_core -lRHVoice_audio"

  UkrainianVoices:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - Extension/Bridge
    postBuildScripts:
      - name: Copy Voices
        script: |
          echo "📦 Copying RHVoiceData to bundle..."
          DATA_SRC="${SRCROOT}/Extension/Resources/RHVoiceData"
          DATA_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/RHVoiceData"
          
          if [ -d "$DATA_SRC" ]; then
            cp -r "$DATA_SRC" "$DATA_DST"
            echo "✅ RHVoiceData copied: $(find "$DATA_DST" -type f | wc -l) files"
            ls -la "$DATA_DST"
          else
            echo "❌ RHVoiceData not found: $DATA_SRC"
            exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.ukraine.app.5NNZPP8CRR
        INFOPLIST_FILE: App/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridge/UkrainianVoices-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Extension/Libraries"
        OTHER_LDFLAGS: "-lRHVoice -lRHVoice_core -lRHVoice_audio"
    dependencies:
      - target: UkrainianVoicesExtension
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
    
  UkrainianVoicesExtension:
    type: app-extension
    platform: iOS
    sources:
      - Extension/Provider
      - Extension/Bridge
      - Extension/Models
      - Extension/Services
      - Extension/Views
    postBuildScripts:
      - name: Copy Voices to Extension
        script: |
          echo "📦 Copying RHVoiceData to Extension bundle..."
          DATA_SRC="${SRCROOT}/Extension/Resources/RHVoiceData"
          DATA_DST="${BUILT_PRODUCTS_DIR}/UkrainianVoicesExtension.appex/RHVoiceData"
          
          if [ -d "$DATA_SRC" ]; then
            cp -r "$DATA_SRC" "$DATA_DST"
            echo "✅ RHVoiceData copied to Extension: $(find "$DATA_DST" -type f | wc -l) files"
          else
            echo "❌ RHVoiceData not found: $DATA_SRC"
            exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.ukraine.app.5NNZPP8CRR.Extension
        INFOPLIST_FILE: Extension/Info-iOS.plist
        SWIFT_VERSION: "5.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        DEFINES_MODULE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridge/UkrainianVoices-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Extension/Libraries"
        OTHER_LDFLAGS: "-lRHVoice -lRHVoice_core -lRHVoice_audio"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework

  UkrainianVoicesMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info-iOS.plist
    postBuildScripts:
      - name: Copy RHVoiceData
        script: |
          echo "📦 Copying RHVoiceData to macOS bundle..."
          DATA_SRC="${SRCROOT}/Extension/Resources/RHVoiceData"
          DATA_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/RHVoiceData"
          
          if [ -d "$DATA_SRC" ]; then
            mkdir -p "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources"
            cp -r "$DATA_SRC" "$DATA_DST"
            echo "✅ RHVoiceData copied: $(find "$DATA_DST" -type f | wc -l) files"
          else
            echo "❌ RHVoiceData not found: $DATA_SRC"
            exit 1
          fi
        basedOnDependencyAnalysis: false
      - name: Embed RHVoice dylibs
        script: |
          echo "📦 Embedding macOS RHVoice dylibs..."
          # Choose dylibs matching the build architecture.
          # GitHub runners are often arm64 even when building x86_64, so don't use `uname -m`.
          if echo "${ARCHS:-}" | grep -q "x86_64"; then
            DYLIB_SRC="${SRCROOT}/Extension/Libraries_macos_x86_64"
          else
            DYLIB_SRC="${SRCROOT}/Extension/Libraries_macos_arm64"
          fi
          DYLIB_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Frameworks"

          mkdir -p "$DYLIB_DST"

          for lib in libRHVoice.dylib libRHVoice_core.dylib libRHVoice_audio.dylib; do
            if [ ! -f "$DYLIB_SRC/$lib" ]; then
              echo "❌ Missing macOS dylib: $DYLIB_SRC/$lib"
              exit 1
            fi
            cp -f "$DYLIB_SRC/$lib" "$DYLIB_DST/$lib"
            echo "✅ Embedded $lib"
          done

          # Some builds reference dylibs with a double-dot name (e.g. libRHVoice..dylib).
          # Create symlinks so dyld can resolve @rpath/libRHVoice..dylib.
          cd "$DYLIB_DST"
          for lib in libRHVoice.dylib libRHVoice_core.dylib libRHVoice_audio.dylib; do
            base="${lib%.dylib}"
            ln -sf "$lib" "${base}..dylib"
            echo "✅ Symlink ${base}..dylib -> $lib"
          done
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.UkrainianVoices.mac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/UkrainianVoicesMac.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Extension/Libraries_macos_x86_64 $(SRCROOT)/Extension/Libraries_macos_arm64"
        OTHER_LDFLAGS: "-lRHVoice -lRHVoice_core -lRHVoice_audio"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    dependencies:
      - target: UkrainianVoicesExtensionMac
      - target: RHVoiceKitMac
        embed: true
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework

  UkrainianVoicesExtensionMac:
    type: app-extension
    platform: macOS
    sources:
      - Extension/Provider
      - Extension/Bridge
      - Extension/Models
      - Extension/Services
      - Extension/Views
    resources:
      - path: Extension/Resources/RHVoiceData
    postBuildScripts:
      - name: Embed RHVoice dylibs to Extension
        script: |
          echo "📦 Embedding macOS RHVoice dylibs into extension..."
          # Choose dylibs matching the build architecture.
          if echo "${ARCHS:-}" | grep -q "x86_64"; then
            DYLIB_SRC="${SRCROOT}/Extension/Libraries_macos_x86_64"
          else
            DYLIB_SRC="${SRCROOT}/Extension/Libraries_macos_arm64"
          fi

          EXT_PATH="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.appex"
          DYLIB_DST="${EXT_PATH}/Contents/Frameworks"
          mkdir -p "$DYLIB_DST"

          for lib in libRHVoice.dylib libRHVoice_core.dylib libRHVoice_audio.dylib; do
            if [ ! -f "$DYLIB_SRC/$lib" ]; then
              echo "❌ Missing macOS dylib: $DYLIB_SRC/$lib"
              exit 1
            fi
            cp -f "$DYLIB_SRC/$lib" "$DYLIB_DST/$lib"
            echo "✅ Embedded $lib"
          done

          cd "$DYLIB_DST"
          for lib in libRHVoice.dylib libRHVoice_core.dylib libRHVoice_audio.dylib; do
            base="${lib%.dylib}"
            ln -sf "$lib" "${base}..dylib"
            echo "✅ Symlink ${base}..dylib -> $lib"
          done
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreAudioKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhvoice.UkrainianVoices.mac.Extension
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/UkrainianVoicesExtensionMac.entitlements
        SWIFT_VERSION: "5.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridge/UkrainianVoices-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Extension/Libraries_macos_x86_64 $(SRCROOT)/Extension/Libraries_macos_arm64"
        OTHER_LDFLAGS: "-lRHVoice -lRHVoice_core -lRHVoice_audio"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
    postBuildScripts:
      - name: Embed RHVoice dylibs in extension
        script: |
          echo "📦 Embedding RHVoice dylibs in extension..."
          if echo "${ARCHS:-}" | grep -q "x86_64"; then
            DYLIB_SRC="${SRCROOT}/Extension/Libraries_macos_x86_64"
          else
            DYLIB_SRC="${SRCROOT}/Extension/Libraries_macos_arm64"
          fi
          DYLIB_DST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Frameworks"

          mkdir -p "$DYLIB_DST"

          for lib in libRHVoice.dylib libRHVoice_core.dylib libRHVoice_audio.dylib; do
            if [ ! -f "$DYLIB_SRC/$lib" ]; then
              echo "❌ Missing macOS dylib: $DYLIB_SRC/$lib"
              exit 1
            fi
            cp -f "$DYLIB_SRC/$lib" "$DYLIB_DST/$lib"
            echo "✅ Embedded $lib into extension"
          done

          # Create double-dot symlinks for dyld compatibility.
          cd "$DYLIB_DST"
          for lib in libRHVoice.dylib libRHVoice_core.dylib libRHVoice_audio.dylib; do
            base="${lib%.dylib}"
            ln -sf "$lib" "${base}..dylib"
            echo "✅ Symlink ${base}..dylib -> $lib"
          done
        basedOnDependencyAnalysis: false
